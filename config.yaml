# Central configuration for the pipeline.
# Change values here instead of hardcoding them in code — this also
# doubles as the "experiment config" logged to MLflow for each run.
chunking:
  chunk_size: 500
  chunk_overlap: 50
  strategy: "section_aware"
  min_chunk_chars: 40   # lower this (e.g. to 15-20) for flashcard-style notes


embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cpu"

vector_store:
  persist_directory: "data/chroma_db"
  collection_name: "research_papers"

retrieval:
  vector_top_k: 20
  bm25_top_k: 20
  final_top_k: 5
  use_hybrid: true
  use_reranker: true
  reranker_model: "BAAI/bge-reranker-base"

llm:
  provider: "groq"              # "groq" or "ollama"
  model_name: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_tokens: 1024

verification:
  enabled: true
  max_regenerate_attempts: 1
  verifier_model_name: "llama-3.1-8b-instant"  # cheaper/faster model for verification calls

mlflow:
  experiment_name: "scholarcite-rag"
  tracking_uri: "./mlruns"

app:
  title: "ScholarCite-RAG"

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  batch_size: 32

vector_store:
  persist_directory: "data/chroma_db"
  collection_name: "scholarcite_chunks"
  top_k: 5

llm:
  provider: "groq"
  generation_model: "openai/gpt-oss-120b"
  verification_model: "openai/gpt-oss-20b"
  temperature: 0.1
  max_tokens: 1024

verification:
  max_attempts: 2          # total generate attempts before giving up and flagging
  temperature: 0.0         # verifier should be deterministic, not creative

retrieval:
  use_hybrid: true
  use_reranker: true
  vector_top_k: 15        # candidates pulled from vector search before merging
  bm25_top_k: 15           # candidates pulled from BM25 before merging
  final_top_k: 5           # what actually gets returned after reranking
  rrf_k: 60                # standard RRF smoothing constant (60 is the widely-used default)
  reranker_model: "BAAI/bge-reranker-base"